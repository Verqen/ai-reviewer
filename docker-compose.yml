services:
  postgres:
    image: postgres:17.4
    environment:
      POSTGRES_DB: ai_reviewer
      POSTGRES_USER: ai_reviewer
      POSTGRES_PASSWORD: ai_reviewer
    ports:
      - "5433:5432"
    volumes:
      - ai_reviewer_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_reviewer -d ai_reviewer"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  ai_reviewer_pgdata:
